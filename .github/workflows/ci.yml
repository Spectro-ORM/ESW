name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS 15 tops out at Xcode 26.3 (Swift 6.2), so it uses a swift.org 6.3 toolchain.
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3, Swiftly-backed installer
        with:
          swift-version: "6.3.3"
      - name: Unit tests
        run: swift test
      - name: Compiler and plugin consumer integration
        run: python3 scripts/check_integration.py

  linux:
    runs-on: ubuntu-latest
    container: swift:6.3
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
